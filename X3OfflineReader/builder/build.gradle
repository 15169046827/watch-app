plugins {
    id 'application'
}

apply from: rootProject.file('../gradle/android-java-quality.gradle')

group = 'com.canace.x3offlinereader'
version = '0.7.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.canace.x3offlinereader.builder.BuilderMain'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
    environment 'X3_BUILDER_WORK_ROOT', ''
    dependsOn 'testDependencySecurity'
    dependsOn 'testPackagingPolicy'
}

tasks.register('testDependencySecurity', Exec) {
    group = 'verification'
    description = 'Run isolated, stdlib-only dependency security policy fixtures.'
    commandLine providers.environmentVariable('X3_BUILDER_TEST_PYTHON').getOrElse('python'),
            '-B', file('tools/run_security_tests.py').absolutePath
}

tasks.register('testPackagingPolicy', Exec) {
    group = 'verification'
    description = 'Run Windows portable packaging option policy fixtures.'
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('tools/test-packaging-policy.ps1').absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
