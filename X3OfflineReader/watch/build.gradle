plugins {
    id 'com.android.application'
}

def stableDebugKey = rootProject.file('../.signing/x3-debug.keystore')
// Media3 1.10.x requires compileSdk 36. Keep the first device-risk spike on the
// workspace-standard AGP 8.7.3 / compileSdk 35 toolchain and validate 1.8.0 on API 30.
def media3Version = '1.8.0'

android {
    namespace 'com.canace.x3offlinereader'
    compileSdk 35
    useLibrary 'android.test.base'
    useLibrary 'android.test.runner'

    defaultConfig {
        applicationId 'com.canace.x3offlinereader'
        minSdk 26
        targetSdk 30
        versionCode 8
        versionName '0.5.2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        if (stableDebugKey.isFile()) {
            debug {
                storeFile stableDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (stableDebugKey.isFile()) { signingConfig signingConfigs.debug }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // Visible controls are intentionally conventional buttons, not flat Android button bars.
        // 466px round-screen utility labels deliberately use 10sp to keep controls single-line.
        disable 'ExpiredTargetSdkVersion', 'GradleDependency', 'ButtonStyle', 'SmallSp'
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.6.0'
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-session:${media3Version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
