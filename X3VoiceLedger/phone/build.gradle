plugins {
    id 'com.android.application'
}

apply from: rootProject.file('../gradle/shared-debug-signing-v1.gradle')
apply from: rootProject.file('../gradle/shared-release-signing-v1.gradle')
apply from: rootProject.file('../gradle/android-java-quality.gradle')

android {
    namespace 'com.canace.x3voiceledger.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.canace.x3voiceledger.phone'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.8.6'
        testInstrumentationRunner 'com.canace.x3voiceledger.phone.SyntheticBackupRunner'
    }


    lint {
        // SDK and dependency upgrades are intentionally separated from behavior changes and device acceptance.
        disable 'ExpiredTargetSdkVersion', 'GradleDependency'
    }
}

dependencies {
    implementation project(':common')
    implementation files('libs/jxl-2.6.12.jar')
}
