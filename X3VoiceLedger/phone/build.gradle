plugins {
    id 'com.android.application'
}

def stableDebugKey = rootProject.file('../.signing/x3-debug.keystore')

android {
    namespace 'com.canace.x3voiceledger.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.canace.x3voiceledger.phone'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.8.4'
    }


    signingConfigs {
        if (stableDebugKey.isFile()) {
            debug {
                storeFile stableDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (stableDebugKey.isFile()) { signingConfig signingConfigs.debug }
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion', 'GradleDependency'
    }
}

dependencies {
    implementation project(':common')
    implementation files('libs/jxl-2.6.12.jar')
}
