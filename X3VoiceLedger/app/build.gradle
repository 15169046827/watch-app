plugins {
    id 'com.android.application'
}

apply from: rootProject.file('../gradle/shared-debug-signing-v1.gradle')
apply from: rootProject.file('../gradle/shared-release-signing-v1.gradle')
apply from: rootProject.file('../gradle/android-java-quality.gradle')

android {
    namespace 'com.canace.x3voiceledger'
    compileSdk 30

    defaultConfig {
        applicationId 'com.canace.x3voiceledger'
        minSdk 26
        targetSdk 30
        versionCode 13
        versionName '0.8.4'
        testInstrumentationRunner 'com.canace.x3voiceledger.SyntheticBlePeripheralRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // API 30 is intentional for the customized Android 11 watch runtime; upgrades need device validation.
        disable 'ExpiredTargetSdkVersion', 'GradleDependency'
        // The watch UI is portrait-locked for its circular launcher and confirmation flow.
        disable 'LockedOrientationActivity'
        // Legacy system-UI and location calls are retained for the verified API 30 firmware.
        disable 'DiscouragedApi'
    }
}

dependencies {
    implementation project(':common')
}
