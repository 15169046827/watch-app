plugins {
    id 'com.android.application'
}

apply from: rootProject.file('../gradle/shared-debug-signing-v1.gradle')
apply from: rootProject.file('../gradle/android-java-quality.gradle')

// Keep build outputs separate from a legacy app/build directory that may be
// held open by Android Studio or another Gradle process on Windows.
layout.buildDirectory = rootProject.layout.projectDirectory.dir('.build/app')

android {
    namespace 'com.example.x3accessibilityprobe'
    compileSdk 30

    lint {
        // This ADB-sideloaded probe intentionally targets the watch's Android 11 behavior.
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId 'com.example.x3accessibilityprobe'
        minSdk 30
        targetSdk 30
        versionCode 12
        versionName '1.11'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
