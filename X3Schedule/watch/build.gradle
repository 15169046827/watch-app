plugins { id 'com.android.application' }
def stableDebugKey = rootProject.file('../.signing/x3-debug.keystore')
if (!stableDebugKey.isFile()) throw new GradleException('Shared Debug key is missing; never generate a replacement.')
android {
    lint { warningsAsErrors true }
    namespace 'com.canace.x3schedule'
    compileSdk 35
    defaultConfig { testInstrumentationRunner 'com.canace.x3schedule.shared.StoreTestRunner'; applicationId 'com.canace.x3schedule'; minSdk 26; targetSdk 30; versionCode 15; versionName '0.6.0' }
    sourceSets {
        androidTest.java.srcDir '../phone/src/androidTest/java'
        validation.java.srcDir '../phone/src/validation/java'
    }
    signingConfigs { debug { storeFile stableDebugKey; storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    // Validation runs the same production sources in a separate UID and data directory.
    testBuildType providers.gradleProperty('scheduleTestBuildType').getOrElse('debug')
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        background {
            initWith debug
            applicationIdSuffix '.background'
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
        }
        validation {
            initWith debug
            applicationIdSuffix '.validation'
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies { implementation project(':shared') }

apply from: rootProject.file('../gradle/shared-debug-signing-v1.gradle')
apply from: rootProject.file('../gradle/shared-release-signing-v1.gradle')

apply from: rootProject.file('../gradle/android-java-quality.gradle')
