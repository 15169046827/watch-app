plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
dependencies { api 'com.google.code.gson:gson:2.10.1'; testImplementation 'junit:junit:4.13.2' }
test { testLogging { events 'failed', 'skipped' } }

apply from: rootProject.file('../gradle/android-java-quality.gradle')
